name: Test and Release

# Run this job on all pushes and pull requests, as well as tags with a semantic version. "branches:
# main" is declared (not dropped) so the ioBroker repository checker's E3007 rule is satisfied -
# the actual "don't re-test a push to main, the merged PR already was" skip lives in each job's own
# "if:" below instead, since that gets the same result without an empty-feeling trigger config.
on:
  push:
    branches:
      - "main"
    tags:
      # normal versions
      - "v[0-9]+.[0-9]+.[0-9]+"
      # pre-releases
      - "v[0-9]+.[0-9]+.[0-9]+-**"
  pull_request: {}

# Cancel previous PR/branch runs when a new commit is pushed
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Performs quick checks before the expensive test runs
  check-and-lint:
    # Skip for a plain push to main - that commit was already tested on its merged pull
    # request. Still runs for pull requests and for an actual version tag push.
    if: |
      contains(github.event.head_commit.message, '[skip ci]') == false &&
      (github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/'))

    runs-on: ubuntu-latest

    steps:
      - uses: ioBroker/testing-action-check@v2
        with:
          node-version: '22.x'
          # Uncomment the following line if your adapter cannot be installed using 'npm ci'
          # install-command: 'npm install'
          lint: true

  # Runs adapter tests on all supported node versions and OSes
  adapter-tests:
    needs: check-and-lint
    # Same skip as check-and-lint above.
    if: |
      contains(github.event.head_commit.message, '[skip ci]') == false &&
      (github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/'))

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: ioBroker/testing-action-adapter@v1
        with:
          node-version: ${{ matrix.node-version }}
          os: ${{ matrix.os }}
          # TypeScript sources in src/ are compiled to build/ (package main is build/main.js)
          build: true
          # Uncomment the following line if your adapter cannot be installed using 'npm ci'
          # install-command: 'npm install'

  # Deploys the final package to NPM via trusted publishing (OIDC, no npm token needed)
  # and creates the GitHub release. Trusted publisher configured on npmjs.com for this
  # repo + workflow filename.
  deploy:
    needs: [check-and-lint, adapter-tests]

    # Trigger this step only when a commit on any branch is tagged with a version number
    if: |
      contains(github.event.head_commit.message, '[skip ci]') == false &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    # id-token: write is required for npm trusted publishing (OIDC), contents: write for the GitHub release
    permissions:
      id-token: write
      contents: write

    steps:
      - uses: ioBroker/testing-action-deploy@v1
        with:
          node-version: '24.x'
          # The published package ships the compiled build/ directory
          build: true
          # Uncomment the following line if your adapter cannot be installed using 'npm ci'
          # install-command: 'npm install'
          github-token: ${{ secrets.GITHUB_TOKEN }}

          # Sentry error-reporting integration deliberately not set up yet - revisit once/if
          # the adapter is accepted into the official ioBroker repository (shared DSN assigned
          # then) rather than using a personal Sentry.io project for a not-yet-listed adapter.
